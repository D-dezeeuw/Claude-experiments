<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaussian Fluids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(13,17,23,0.92); border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; color: #e6edf3;
            min-width: 220px; font-size: 13px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        #ui h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        #ui .sub { color: #8b949e; font-size: 11px; margin-bottom: 12px; }
        #ui label { display: block; margin-bottom: 10px; }
        #ui label span { display: block; color: #8b949e; font-size: 11px; margin-bottom: 3px; }
        #ui select, #ui input[type=range] { width: 100%; }
        #ui select {
            background: #161b22; color: #e6edf3; border: 1px solid #30363d;
            border-radius: 4px; padding: 4px 6px; font-size: 12px;
        }
        #ui input[type=range] { accent-color: #58a6ff; }
        #ui .val { float: right; color: #58a6ff; font-size: 11px; font-weight: 600; }
        #stats {
            position: absolute; bottom: 12px; left: 12px; z-index: 10;
            background: rgba(13,17,23,0.85); border: 1px solid #30363d;
            border-radius: 6px; padding: 8px 12px; color: #8b949e;
            font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace;
            backdrop-filter: blur(8px);
        }
        #back {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            background: rgba(13,17,23,0.85); border: 1px solid #30363d;
            border-radius: 6px; padding: 6px 12px; color: #58a6ff;
            text-decoration: none; font-size: 12px;
            backdrop-filter: blur(8px);
        }
        #back:hover { background: rgba(88,166,255,0.1); }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="ui">
        <h1>Gaussian Fluids</h1>
        <div class="sub">Grid-free Navier-Stokes &middot; WebGL 2</div>
        <label>
            <span>Preset</span>
            <select id="preset">
                <option value="taylor-green">Taylor-Green Vortex</option>
                <option value="vortex-pair">Vortex Pair</option>
                <option value="free" selected>Free Canvas</option>
            </select>
        </label>
        <label>
            <span>Quality <span class="val" id="qualVal">Medium</span></span>
            <input type="range" id="quality" min="0" max="2" value="1">
        </label>
        <label>
            <span>Viscosity <span class="val" id="viscVal">0.001</span></span>
            <input type="range" id="viscosity" min="0" max="100" value="10">
        </label>
        <label>
            <span>Brush Size <span class="val" id="brushVal">0.08</span></span>
            <input type="range" id="brushSize" min="1" max="100" value="30">
        </label>
        <label>
            <span>Visualization</span>
            <select id="vizMode">
                <option value="dye" selected>Dye</option>
                <option value="vorticity">Vorticity</option>
                <option value="velocity">Velocity Magnitude</option>
                <option value="debug">Debug (Gaussians)</option>
            </select>
        </label>
    </div>
    <div id="stats">Initializing...</div>
    <a id="back" href="index.html">&larr; Projects</a>
    <script type="module" src="js/fluid/app.js"></script>
</body>
</html>
