<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">

    <nav class="max-w-5xl mx-auto px-6 pt-6 flex items-center justify-between">
        <a href="../index.html" class="text-sm font-semibold text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Claude Experiments</a>
        <div class="flex items-center gap-1">
            <a href="index.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-200 transition-colors">Dashboard</a>
            <a href="visualize.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-200 transition-colors">3D View</a>
            <a href="backtest.html" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600/20 text-blue-400 transition-colors">Backtester</a>
            <button id="theme-toggle" aria-label="Toggle theme" class="ml-2 p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors cursor-pointer"></button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-10">
        <header class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Backtester</h1>
            <p class="mt-1 text-gray-500 dark:text-gray-400">Test, validate, and compare trading strategies</p>
        </header>

        <!-- Controls -->
        <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Stock</label>
                    <select id="bt-symbol" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Strategy</label>
                    <select id="bt-strategy" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Initial Capital</label>
                    <input id="bt-capital" type="number" value="10000" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm font-mono">
                </div>
                <div class="flex items-end">
                    <button onclick="BacktestApp.run()" class="w-full px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition-colors cursor-pointer">
                        Run Backtest
                    </button>
                </div>
            </div>
            <div id="bt-params" class="flex flex-wrap gap-4 text-sm"></div>
            <div id="bt-status" class="mt-3 text-xs text-gray-500 dark:text-gray-400"></div>
        </div>

        <!-- Scenario Tabs -->
        <div id="bt-tabs" class="hidden">
            <div class="flex gap-1 border-b border-gray-200 dark:border-gray-800 mb-6">
                <button onclick="BacktestApp.switchTab('results')" data-tab="results" class="scenario-tab px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-blue-500 text-blue-500">Results</button>
                <button onclick="BacktestApp.switchTab('validation')" data-tab="validation" class="scenario-tab px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-gray-500 hover:text-gray-300">Validation</button>
                <button onclick="BacktestApp.switchTab('sizing')" data-tab="sizing" class="scenario-tab px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-gray-500 hover:text-gray-300">Position Sizing</button>
                <button onclick="BacktestApp.switchTab('compare')" data-tab="compare" class="scenario-tab px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-gray-500 hover:text-gray-300">Strategy Comparison</button>
            </div>

            <!-- Tab: Results -->
            <div id="tab-results" class="scenario-content">
                <div id="bt-metrics" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6"></div>
                <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 mb-6">
                    <h3 class="text-sm font-semibold mb-3">Equity Curve</h3>
                    <div id="bt-chart" class="w-full" style="height:200px"></div>
                </div>
                <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6">
                    <h3 class="text-sm font-semibold mb-3">Trade Log</h3>
                    <div id="bt-trades" class="overflow-x-auto"></div>
                </div>
            </div>

            <!-- Tab: Validation -->
            <div id="tab-validation" class="scenario-content hidden">
                <div id="bt-validation" class="space-y-6"></div>
            </div>

            <!-- Tab: Position Sizing -->
            <div id="tab-sizing" class="scenario-content hidden">
                <div id="bt-sizing" class="space-y-6"></div>
            </div>

            <!-- Tab: Strategy Comparison -->
            <div id="tab-compare" class="scenario-content hidden">
                <div id="bt-compare" class="space-y-6"></div>
            </div>
        </div>

        <div class="mt-8 text-xs text-gray-400 dark:text-gray-500 text-center">
            Educational experiment only. Past performance does not predict future results.
        </div>
    </div>

</body>
</html>
