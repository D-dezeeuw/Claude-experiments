<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Starfield - TraderAI</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = { darkMode: 'class' }

    <style>
        #canvas-container { position: relative; width: 100%; height: 70vh; min-height: 500px; }
        #canvas-container canvas { display: block; width: 100%; height: 100%; }
        #tooltip {
            position: absolute; pointer-events: none; z-index: 50;
            background: rgba(15,23,42,0.95); border: 1px solid rgba(59,130,246,0.3);
            border-radius: 8px; padding: 10px 14px; font-size: 12px;
            color: #e2e8f0; display: none; min-width: 180px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #tooltip .tt-symbol { font-size: 14px; font-weight: 700; color: #60a5fa; }
        #tooltip .tt-company { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        #tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; }
        #tooltip .tt-label { color: #64748b; }
        #tooltip .tt-value { font-family: monospace; font-weight: 600; }
        .label-2d {
            color: rgba(180,180,200,0.7); font-size: 10px; font-family: monospace;
            pointer-events: none; white-space: nowrap; text-shadow: 0 0 6px rgba(0,0,0,0.8);
        }
        .label-2d.hovered { color: #60a5fa; font-size: 13px; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/theme.js"></script>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">

    <nav class="max-w-6xl mx-auto px-6 pt-6 flex items-center justify-between">
        <a href="../index.html" class="text-sm text-gray-500 dark:text-gray-400 hover:text-blue-400 transition-colors">Claude Experiments</a>
        <div class="flex items-center gap-1">
            <a href="index.html" class="px-3 py-1.5 text-sm rounded-lg text-gray-400 hover:text-gray-200 transition-colors">Dashboard</a>
            <a href="visualize.html" class="px-3 py-1.5 text-sm rounded-lg bg-blue-600/20 text-blue-400 font-medium">3D View</a>
            <a href="backtest.html" class="px-3 py-1.5 text-sm rounded-lg text-gray-400 hover:text-gray-200 transition-colors">Backtester</a>
            <button onclick="toggleTheme()" class="ml-3 p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors cursor-pointer" title="Toggle theme">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
        </div>

    <div class="max-w-6xl mx-auto px-6 py-6">
        <header class="mb-4">
            <h1 class="text-2xl font-bold tracking-tight">3D Stock Starfield</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">49 stocks plotted as stars across 5 dimensions</p>
        </header>

        <!-- Axis selectors -->
        <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-4 mb-4">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-orange-400 mb-1">X Axis</label>
                    <select id="axis-x" class="w-full px-2 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-blue-400 mb-1">Y Axis</label>
                    <select id="axis-y" class="w-full px-2 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-gray-400 mb-1">Z Axis</label>
                    <select id="axis-z" class="w-full px-2 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-purple-400 mb-1">Color</label>
                    <select id="axis-color" class="w-full px-2 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-green-400 mb-1">Size</label>
                    <select id="axis-size" class="w-full px-2 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"></select>
                </div>
            </div>
        </div>

        <!-- 3D canvas -->
        <div id="canvas-container" class="rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden bg-[#08080f]">
            <div id="tooltip"></div>
            <div id="loading-overlay" class="absolute inset-0 flex items-center justify-center z-10">
                <span class="text-sm text-gray-500 animate-pulse">Loading stock data...</span>
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-3 flex flex-wrap items-center gap-4 text-xs text-gray-500">
            <span>Drag to rotate</span>
            <span>Scroll to zoom</span>
            <span>Hover for details</span>
            <span>Click stock below to focus</span>
            <span id="stock-count" class="ml-auto font-mono"></span>
        </div>

        <!-- Stock List -->
        <div class="mt-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-4">
            <h3 class="text-sm font-semibold mb-3">Stocks <span class="text-gray-500 font-normal">— click to focus on chart</span></h3>
            <div id="stock-list">
                <span class="text-xs text-gray-500 animate-pulse">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Visualization scripts (ES module) -->
    <script type="module" src="js/visualize/viz-main.js"></script>
</body>
</html>
